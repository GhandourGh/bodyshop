version: '3.9'

services:
  ai:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./intern-db
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: ./intern-db/.env
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./autoforge-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
